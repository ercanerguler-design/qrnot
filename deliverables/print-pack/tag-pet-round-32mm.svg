<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="32mm" height="32mm" viewBox="0 0 32 32">
  <title>QRNot Evcil Etiketi - 32mm</title>
  <desc>Premium yuvarlak evcil etiket tasarımı: neon çerçeve, QR alanı ve Türkçe metin.</desc>

  <defs>
    <radialGradient id="petBg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#131B31"/>
      <stop offset="100%" stop-color="#090D18"/>
    </radialGradient>
    <linearGradient id="petNeonA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3AD0FF"/>
      <stop offset="55%" stop-color="#774DFF"/>
      <stop offset="100%" stop-color="#EA35FF"/>
    </linearGradient>
    <linearGradient id="petNeonB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B85DFF"/>
      <stop offset="100%" stop-color="#1DCCFF"/>
    </linearGradient>
  </defs>

  <circle cx="16" cy="16" r="16" fill="#080C16"/>
  <circle cx="16" cy="16" r="15.0" fill="url(#petBg)"/>
  <circle cx="16" cy="16" r="14.7" fill="none" stroke="url(#petNeonA)" stroke-width="0.56"/>
  <circle cx="16" cy="16" r="13.8" fill="none" stroke="url(#petNeonB)" stroke-width="0.28" opacity="0.95"/>

  <!-- ip takma deliği: üst-orta -->
  <circle cx="16" cy="3.5" r="1.35" fill="#070B16" stroke="#D9E6FF" stroke-width="0.22"/>

  <g fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="16" y="7.9" font-size="2.05" font-weight="700">QRNot PET</text>

    <rect x="8.4" y="8.9" width="15.2" height="15.2" rx="1.1" fill="#FFFFFF"/>
    <rect x="9.1" y="9.6" width="13.8" height="13.8" fill="none" stroke="#C9CFDA" stroke-width="0.2"/>
    <text x="16" y="16.4" font-size="1.35" fill="#2F3749">QR</text>

    <text x="16" y="25.9" font-size="0.96" font-weight="700">Bulduysan okut,</text>
    <text x="16" y="27.45" font-size="0.83" fill="#D8DDE9">sahibine ulaştır.</text>

    <!-- sembol: en alt merkez -->
    <path d="M15.15 28.55a0.85 0.85 0 0 1 1.7 0" fill="none" stroke="#EAF0FF" stroke-width="0.17" stroke-linecap="round"/>
    <rect x="14.8" y="28.58" width="0.22" height="0.48" rx="0.11" fill="#EAF0FF"/>
    <rect x="16.98" y="28.58" width="0.22" height="0.48" rx="0.11" fill="#EAF0FF"/>
    <circle cx="16" cy="29.25" r="0.1" fill="#EAF0FF"/>
  </g>
</svg>
